name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      # Changes that never affect the apps. LICENSE and THIRD_PARTY_NOTICES.md are built
      # into the app, and packaging/ READMEs ship in the downloads, so those still build.
      # GitHub never applies path filters to tag pushes, so v* release builds always run.
      - "README.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
      - ".gitignore"
      - ".gitattributes"
  pull_request:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
      - ".gitignore"
      - ".gitattributes"
  workflow_dispatch:

permissions:
  contents: read

# No ROM, BIOS or game data is available in CI; tests that need them skip themselves.

jobs:
  macos:
    name: macOS (universal)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .deps
          key: deps-macos-${{ hashFiles('CMakeLists.txt') }}
      - name: Tools
        run: brew list ninja >/dev/null 2>&1 || brew install ninja
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DFETCHCONTENT_BASE_DIR="$GITHUB_WORKSPACE/.deps"
          -DKNID_MACOS_BUNDLE=ON -DKNID_VENDOR_SDL=ON -DKNID_BUILD_TOOLS=OFF
          "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Build
        run: cmake --build build
      - name: Test
        run: |
          if ctest --test-dir build --output-on-failure > ctest.log 2>&1; then
            cat ctest.log
          else
            cat ctest.log
            echo "::error title=ctest (macOS)::$(tail -n 40 ctest.log | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi
      - name: Package
        run: cmake --build build --target dmg
      - uses: actions/upload-artifact@v4
        with:
          name: KNID-macOS
          path: build/KNID-*-macOS.dmg
          if-no-files-found: error

  windows:
    name: Windows (x64)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            .deps
            ${{ github.workspace }}/vcpkg-cache
          key: deps-windows-${{ hashFiles('CMakeLists.txt') }}
      - name: zlib (vcpkg, static)
        shell: pwsh
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg" install zlib:x64-windows-static
      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          "-DFETCHCONTENT_BASE_DIR=$env:GITHUB_WORKSPACE/.deps"
          -DKNID_VENDOR_SDL=ON -DKNID_BUILD_TOOLS=OFF -DKNID_PACKAGE=ON
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        shell: bash
        run: |
          if ctest --test-dir build -C Release --output-on-failure > ctest.log 2>&1; then
            cat ctest.log
          else
            cat ctest.log
            echo "::error title=ctest (Windows)::$(tail -n 40 ctest.log | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi
      - name: Package
        run: cmake --build build --config Release --target package_exe
      - name: Check the exe is self-contained
        # Only Windows system DLLs may be imported (no MSVC runtime, SDL, zlib or other DLLs).
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * -find "VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $exe = Get-ChildItem build -Filter "KNID-*-Windows-x64.exe" | Select-Object -First 1
          $deps = & $dumpbin /nologo /dependents $exe.FullName | ForEach-Object { $_.Trim() } | Where-Object { $_ -match '\.dll$' }
          Write-Host "Imports:"; $deps | ForEach-Object { Write-Host "  $_" }
          $bad = $deps | Where-Object {
            $_ -match '^(vcruntime|msvcp|concrt|vccorlib|ucrtbased|api-ms-win-crt|sdl|zlib|z\.dll|libpng|libcurl)' -or
            -not (Test-Path (Join-Path "$env:SystemRoot\System32" $_))
          }
          if ($bad) { Write-Host "::error title=Not self-contained::KNID.exe imports non-system DLLs: $($bad -join ', ')"; exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: KNID-Windows
          path: build/KNID-*-Windows-x64.exe
          if-no-files-found: error

  linux:
    name: Linux (x86_64 AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .deps
          key: deps-linux-${{ hashFiles('CMakeLists.txt') }}
      - name: Tag matches the app version
        # The in-app updater compares the built-in version with the release tag; a mismatch would
        # offer the same release again forever.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(sed -n 's/^project(knid LANGUAGES C CXX VERSION \([0-9.]*\)).*/\1/p' CMakeLists.txt)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the version in CMakeLists.txt ($VERSION)"
            exit 1
          fi
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build zlib1g-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev \
            libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev \
            libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libdrm-dev libgbm-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libudev-dev libdbus-1-dev libibus-1.0-dev \
            libfuse2 file desktop-file-utils
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DFETCHCONTENT_BASE_DIR="$GITHUB_WORKSPACE/.deps"
          -DKNID_VENDOR_SDL=ON -DKNID_BUILD_TOOLS=OFF -DKNID_PACKAGE=ON -DCMAKE_INSTALL_PREFIX=/usr
      - name: Build
        run: cmake --build build
      - name: Test
        run: |
          if ctest --test-dir build --output-on-failure > ctest.log 2>&1; then
            cat ctest.log
          else
            cat ctest.log
            echo "::error title=ctest (Linux)::$(tail -n 40 ctest.log | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi
      - name: AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          ARCH: x86_64
        run: |
          set -o pipefail
          fail() {
            echo "::error title=AppImage::$(tail -n 40 appimage.log | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          }
          {
            set -ex
            VERSION=$(sed -n 's/^project(knid LANGUAGES C CXX VERSION \([0-9.]*\)).*/\1/p' CMakeLists.txt)
            DESTDIR="$PWD/AppDir" cmake --install build
            cp packaging/linux/knid.desktop AppDir/knid.desktop
            cp build/knid.png AppDir/knid.png
            ln -sf usr/bin/knid AppDir/AppRun
            if [ -f recomplauncher.json ]; then cp recomplauncher.json AppDir/recomplauncher.json; fi
            find AppDir -maxdepth 4 | sort
            curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage
            chmod +x appimagetool
            ./appimagetool AppDir "KNID-${VERSION}-Linux-x64.AppImage"
          } > appimage.log 2>&1 || { cat appimage.log; fail; }
          cat appimage.log
      - uses: actions/upload-artifact@v4
        with:
          name: KNID-Linux
          path: KNID-*-Linux-x64.AppImage
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Check release files
        # Only the three built apps (plus the RecompLauncher metadata, when the repository has it)
        # are published; CI never has game files.
        run: |
          set -e
          if [ -f recomplauncher.json ]; then cp recomplauncher.json dist/recomplauncher.json; fi
          ls -la dist
          shopt -s nullglob
          apps=(dist/KNID-*)
          [ "${#apps[@]}" -eq 3 ] || { echo "::error::expected exactly 3 app files in dist/"; exit 1; }
          for f in dist/*; do
            case "$(basename "$f")" in
              KNID-*-macOS.dmg|KNID-*-Windows-x64.exe|KNID-*-Linux-x64.AppImage|recomplauncher.json) ;;
              *) echo "::error::unexpected file in dist/: $f"; exit 1 ;;
            esac
          done
          (cd dist && sha256sum KNID-* > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/KNID-*-macOS.dmg
            dist/KNID-*-Windows-x64.exe
            dist/KNID-*-Linux-x64.AppImage
            dist/SHA256SUMS.txt
            dist/recomplauncher.json
          generate_release_notes: true
