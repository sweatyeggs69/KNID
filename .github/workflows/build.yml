name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# No ROM, BIOS or game data is available in CI; tests that need them skip themselves.

jobs:
  macos:
    name: macOS (universal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .deps
          key: deps-macos-${{ hashFiles('CMakeLists.txt') }}
      - name: Tools
        run: brew list ninja >/dev/null 2>&1 || brew install ninja
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DFETCHCONTENT_BASE_DIR="$GITHUB_WORKSPACE/.deps"
          -DKNID_MACOS_BUNDLE=ON -DKNID_VENDOR_SDL=ON -DKNID_BUILD_TOOLS=OFF
          "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Build
        run: cmake --build build
      - name: Test
        run: |
          if ctest --test-dir build --output-on-failure > ctest.log 2>&1; then
            cat ctest.log
          else
            cat ctest.log
            echo "::error title=ctest (macOS)::$(tail -n 40 ctest.log | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi
      - name: Package
        run: cmake --build build --target dmg
      - uses: actions/upload-artifact@v4
        with:
          name: KNID-macOS
          path: build/KNID-*-macOS.dmg
          if-no-files-found: error

  windows:
    name: Windows (x64)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            .deps
            ${{ github.workspace }}/vcpkg-cache
          key: deps-windows-${{ hashFiles('CMakeLists.txt') }}
      - name: zlib (vcpkg, static)
        shell: pwsh
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg" install zlib:x64-windows-static
      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          "-DFETCHCONTENT_BASE_DIR=$env:GITHUB_WORKSPACE/.deps"
          -DKNID_VENDOR_SDL=ON -DKNID_BUILD_TOOLS=OFF -DKNID_PACKAGE=ON
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        shell: bash
        run: |
          if ctest --test-dir build -C Release --output-on-failure > ctest.log 2>&1; then
            cat ctest.log
          else
            cat ctest.log
            echo "::error title=ctest (Windows)::$(tail -n 40 ctest.log | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi
      - name: Package
        run: cmake --build build --config Release --target package_zip
      - uses: actions/upload-artifact@v4
        with:
          name: KNID-Windows
          path: build/KNID-*-Windows-x64.zip
          if-no-files-found: error

  linux:
    name: Linux (x86_64 AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .deps
          key: deps-linux-${{ hashFiles('CMakeLists.txt') }}
      - name: Tag matches the app version
        # The in-app updater compares the built-in version with the release tag; a mismatch would
        # offer the same release again forever.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(sed -n 's/^project(knid LANGUAGES C CXX VERSION \([0-9.]*\)).*/\1/p' CMakeLists.txt)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the version in CMakeLists.txt ($VERSION)"
            exit 1
          fi
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build zlib1g-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev \
            libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev \
            libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libdrm-dev libgbm-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libudev-dev libdbus-1-dev libibus-1.0-dev \
            libfuse2 file desktop-file-utils
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DFETCHCONTENT_BASE_DIR="$GITHUB_WORKSPACE/.deps"
          -DKNID_VENDOR_SDL=ON -DKNID_BUILD_TOOLS=OFF -DKNID_PACKAGE=ON -DCMAKE_INSTALL_PREFIX=/usr
      - name: Build
        run: cmake --build build
      - name: Test
        run: |
          if ctest --test-dir build --output-on-failure > ctest.log 2>&1; then
            cat ctest.log
          else
            cat ctest.log
            echo "::error title=ctest (Linux)::$(tail -n 40 ctest.log | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi
      - name: AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          ARCH: x86_64
        run: |
          set -o pipefail
          fail() {
            echo "::error title=AppImage::$(tail -n 40 appimage.log | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          }
          {
            set -ex
            VERSION=$(sed -n 's/^project(knid LANGUAGES C CXX VERSION \([0-9.]*\)).*/\1/p' CMakeLists.txt)
            DESTDIR="$PWD/AppDir" cmake --install build
            cp packaging/linux/knid.desktop AppDir/knid.desktop
            cp build/knid.png AppDir/knid.png
            ln -sf usr/bin/knid AppDir/AppRun
            find AppDir -maxdepth 4 | sort
            curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage
            chmod +x appimagetool
            ./appimagetool AppDir "KNID-${VERSION}-x86_64.AppImage"
          } > appimage.log 2>&1 || { cat appimage.log; fail; }
          cat appimage.log
      - uses: actions/upload-artifact@v4
        with:
          name: KNID-Linux
          path: KNID-*-x86_64.AppImage
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Check release files
        # Only the three built apps may be published or scanned (CI never has game files).
        run: |
          set -e
          ls -la dist
          shopt -s nullglob
          files=(dist/*)
          [ "${#files[@]}" -eq 3 ] || { echo "::error::expected exactly 3 files in dist/"; exit 1; }
          for f in "${files[@]}"; do
            case "$(basename "$f")" in
              KNID-*-macOS.dmg|KNID-*-Windows-x64.zip|KNID-*-x86_64.AppImage) ;;
              *) echo "::error::unexpected file in dist/: $f"; exit 1 ;;
            esac
          done
          (cd dist && sha256sum KNID-* > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/KNID-*-macOS.dmg
            dist/KNID-*-Windows-x64.zip
            dist/KNID-*-x86_64.AppImage
            dist/SHA256SUMS.txt
          generate_release_notes: true
      - name: VirusTotal scan links in the release notes
        if: env.VT_API_KEY != ''
        uses: crazy-max/ghaction-virustotal@v4
        with:
          vt_api_key: ${{ env.VT_API_KEY }}
          github_token: ${{ github.token }}
          update_release_body: true
          files: |
            dist/KNID-*-macOS.dmg
            dist/KNID-*-Windows-x64.zip
            dist/KNID-*-x86_64.AppImage
